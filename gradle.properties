mod_license=GPL-3.0
# 1.0.0 になるまで、後方互換は一切考えない(2026-10-16 のご裁定。決まりの本文は ..\CLAUDE.md)。
# 1.0.0 に上げるときは、この決まりを消すこと: 下の no_backcompat_before の行、..\CLAUDE.md の節、助手のメモ no-backcompat-before-1.0。
