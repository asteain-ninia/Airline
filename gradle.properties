mod_description=Air freight between MineColonies colonies (work in progress). An airfield building with a landing pad and a hangar, a pilot who carries the cargo and flies scheduled flights, collection of warehouse surplus onto the airfield's export racks, and air buoys that form a verified route network. Flying needs Sable, Create Aeronautics and ColonyPatch Server.
