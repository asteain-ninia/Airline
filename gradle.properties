org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft / NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1, 1.21.2)
neo_version=21.1.231
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# Mod metadata.
mod_id=airline
mod_name=Create Aeronautics: Airline for MineColonies
mod_license=GPL-3.0
# 1.0.0 になるまで、後方互換は一切考えない。
# 1.0.0 に上げるときは、この決まりを消すこと(下の no_backcompat_before の行)。
# 消さずに mod_version を 1.0.0 以上にすると、ビルドが止まる(build.gradle)。
no_backcompat_before=1.0.0
mod_version=0.21.1
mod_group_id=com.asteain.airline
mod_authors=asteain
mod_description=Air transport between MineColonies colonies, with Create Aeronautics airships. A colony builds airfields (small, medium and large) and anchorages; an airfield builds its aircraft of the classes it can take from parts the colony supplies, and its pilot flies them on a timetable, carrying a warehouse's surplus to the colonies that want it. Routes run between air buoys and airfields and are checked for obstacles before they are flown. The visitors of a colony's tavern arrive with the aircraft. Citizens walk over stopped Sable ships and ride their seats. Flying needs Sable and Create Aeronautics.
