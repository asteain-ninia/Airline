modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''

# A tavern's visitor arrives at an airfield of a colony joined to others by air (2026-10-17).
[[mixins]]
config="${mod_id}.mixins.json"

# Citizens walk over stopped Sable ships (MineColonies path finding); skipped without Sable (pathing/SableMixinPlugin).
[[mixins]]
config="${mod_id}.sable.mixins.json"
requiredMods=["sable"]

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecolonies"
type="required"
versionRange="*"
ordering="AFTER"
side="BOTH"

# The flying part needs these three; without any of them only the flying part is switched off.
[[dependencies.${mod_id}]]
modId="sable"
type="optional"
versionRange="[2.0.5,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="aeronautics"
type="optional"
versionRange="[1.3.2,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="simulated"
type="optional"
versionRange="[1.3.2,)"
ordering="AFTER"
side="BOTH"


# JourneyMap: when a player has it, the lines of the air network are drawn on its maps (client only).
[[dependencies.${mod_id}]]
modId="journeymap"
type="optional"
versionRange="*"
ordering="AFTER"
side="CLIENT"
